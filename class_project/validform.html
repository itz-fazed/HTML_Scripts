<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .registration-form {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .field {
            margin-bottom: 15px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 1.6em;
            font-family: Arial, sans-serif;
        }
        .error{
            color: red;
            font-size: smaller;
            margin: 0;
        }
        .success{
            color: green;
            font-size: smaller;
            margin: 0;
        }
    </style>
</head>
<body>
    <form action="#" method="post" id="registrationForm" class="registration-form" autocomplete="on">
        <h2>Registration Form</h2>
        <div class="field">
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName"><br>
            <p id="fullNameError" class="error"></p>
        </div>
        <div class="field">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br>
            <p id="emailError" class="error"></p>
        </div>
        <div class="field">
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br>
            <p id="phoneError" class="error"></p>
        </div>
        <div class="field">
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br>
            <p id="passwordError" class="error"></p>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword"><br>
            <p id="confirmPasswordError" class="error"></p>
        </div>
        <button type="submit">Register</button>
        <p id="successMessage" class="success"></p>
    </form>

    <script>
        // Create a function to validate the form
        // Create a listener for the form submission
        document.getElementById('registrationForm').addEventListener('submit', function(event){
            event.preventDefault(); // Prevent the default form submission

            // Clear previous error messages
            document.getElementById('fullNameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('phoneError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
            document.getElementById('successMessage').textContent = '';

            // Flag to track if the form is valid
            let isValid = true;

            // Validate Full Name
            const fullName = document.getElementById('fullName').value.trim();
                if (fullName === '') { // Check if the full name is empty
                document.getElementById('fullNameError').textContent = 'Full Name is required.';
                isValid = false;
                }
                else if (!/^[a-zA-Z\s]+$/.test(fullName)) { // Check if the full name contains only letters, spaces and apostrophes
                document.getElementById('fullNameError').textContent = 'Full Name can only contain letters, spaces and apostrophes.';
                isValid = false;
                }

                if (isValid) {
                document.getElementById('successMessage').textContent = 'Registration successful!';
                document.getElementById('successMessage').className = 'success'; // Set the class to success for styling
                }else{
                document.getElementById('successMessage').textContent = 'Please fix the error(s) above.';
                document.getElementById('successMessage').className = 'error'; // Set the class to error for styling
            }
            const email = document.getElementById('email').value.trim();
                const validDomains = ['gmail.com', 'yahoo.com', 'outlook.com', 'strathmore.edu']; // List of valid email domains
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Regular expression for validating email format
                const emailDomain = email.split('@')[1]; // To get the domain from the email address
                if (email === '') { // Check if the email is empty
                document.getElementById('emailError').textContent = 'Email is required.';
                validDomains.join(', ') + '.';
                isValid = false;
                 }
                else if (!emailPattern.test(email)) { // Check if the email is in a valid format
                document.getElementById('emailError').textContent = 'Please enter a valid email address.';
                isValid = false;
                }
                else if(!validDomains.includes(emailDomain)){ // Check if the email domain is valid
                document.getElementById('emailError').textContent = 'Email domain must be one of the following: ' + validDomains.join(', ') + '.';
                isValid = false;
            }

            const phone = document.getElementById('phone').value.trim();
                const phonePattern = /^\+?\d{3,15}$/; // Regular expression for validating phone number (3 to 15 digits)
                if (phone === '') { // Check if the phone number is empty
                document.getElementById('phoneError').textContent = 'Phone Number is required.';
                isValid = false;
                }
                else if (!phonePattern.test(phone)) { // Check if the phone number matches the pattern
                document.getElementById('phoneError').textContent = 'Phone Number must be between 3 and 15 digits.';
                isValid = false;
            }

             const password = document.getElementById('password').value;
                const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>])(?=.*_).{8,}$/; // Regular expression for validating password
                if (password === '') { // Check if the password is empty
                document.getElementById('passwordError').textContent = 'Password is required.';
                isValid = false;
                }
                else if (password.length < 8) { // Check if the password is at least 8 characters long
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters long.';
                isValid = false;
                }
                else if (passwordPattern.test(password)) { // Check if the password meets the complexity requirements
                document.getElementById('passwordError').textContent = 'Password must contain at least one uppercase letter, one lowercase letter, one digit, one special character and one underscore.';
                isValid = false;
            }

             const confirmPassword = document.getElementById('confirmPassword').value;
             if (confirmPassword === '') { // Check if the confirm password is empty
                document.getElementById('confirmPasswordError').textContent = 'Confirm Password is required.';
                isValid = false;
            }
            else if (confirmPassword !== password) { // Check if the confirm password matches the password
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
                isValid = false;
            }

        });
    </script>
</body>
</html>
